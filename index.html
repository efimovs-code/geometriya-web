<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Заголовок вкладки браузера -->
    <title>GEOMETRIYA | Створюємо нові концепції</title>
    
    <!-- ======================================================= -->
    <!-- SEO & OPEN GRAPH (Отображение ссылок в мессенджерах)  -->
    <!-- ======================================================= -->
    
    <!-- Базовое SEO описание для Google -->
    <meta name="description" content="Студія дизайну GEOMETRIYA. Наша мета — наповнити кожен простір справжнім затишком, поєднавши бездоганну естетику та абсолютний комфорт." />
    
    <!-- Open Graph (для Telegram, Facebook, Viber, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://твоя-ссылка.com/" /> <!-- Укажи тут свой домен -->
    <meta property="og:title" content="GEOMETRIYA | Створюємо нові концепції" />
    <meta property="og:description" content="Наша мета — наповнити кожен простір справжнім затишком, поєднавши бездоганну естетику та абсолютний комфорт." />
    <meta property="og:image" content="/og-image.jpg" /> <!-- Картинка, которая будет видна в ссылке -->

    <!-- Twitter Cards (для X/Twitter и некоторых других платформ) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://твоя-ссылка.com/" /> <!-- Укажи тут свой домен -->
    <meta name="twitter:title" content="GEOMETRIYA | Створюємо нові концепції" />
    <meta name="twitter:description" content="Наша мета — наповнити кожен простір справжнім затишком, поєднавши бездоганну естетику та абсолютний комфорт." />
    <meta name="twitter:image" content="/og-image.jpg" /> <!-- Картинка для превью -->
    <!-- ======================================================= -->

    <!-- Оптимизация загрузки шрифтов (Убираем FOIT и блокировку рендеринга) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
