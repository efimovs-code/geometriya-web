<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Browser Tab Title -->
    <title>GEOMETRIYA | Меблі на замовлення</title>
    
    <!-- ======================================================= -->
    <!-- SEO & OPEN GRAPH (Link previews for Messengers/Socials) -->
    <!-- ======================================================= -->
    
    <!-- Base SEO description for Google Search -->
    <meta name="description" content="GEOMETRIYA — виготовлення сучасних меблів на замовлення. Створюємо стильні кухні, шафи та дизайнерські меблі за індивідуальними проєктами для вашого ідеального інтер'єру." />
    
    <!-- Open Graph (for Telegram, Facebook, Viber, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" /> <!-- Replace with your actual domain -->
    <meta property="og:title" content="GEOMETRIYA | Меблі на замовлення" />
    <meta property="og:description" content="GEOMETRIYA — виготовлення сучасних меблів на замовлення. Створюємо стильні кухні, шафи та дизайнерські меблі за індивідуальними проєктами." />
    <meta property="og:image" content="/og-image.jpg" /> <!-- Link preview image (put in /public folder) -->

    <!-- Twitter Cards (for X/Twitter, Slack, Discord) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://your-domain.com/" /> <!-- Replace with your actual domain -->
    <meta name="twitter:title" content="GEOMETRIYA | Меблі на замовлення" />
    <meta name="twitter:description" content="GEOMETRIYA — виготовлення сучасних меблів на замовлення. Створюємо стильні кухні, шафи та дизайнерські меблі за індивідуальними проєктами." />
    <meta name="twitter:image" content="/og-image.jpg" /> <!-- Link preview image -->
    <!-- ======================================================= -->

    <!-- Google Fonts Optimization (Prevents FOIT and render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
